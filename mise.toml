# Tool versions for the host (install mise:
# https://mise.jdx.dev/getting-started.html) and for CI, whose lint and test
# jobs install from this file through jdx/mise-action. The devcontainer pins
# the same versions as Dockerfile ARGs; the parity test (test/test_versions.py)
# keeps the two in step, and ties chezmoi to .chezmoiversion as well.

[tools]
actionlint = "1.7.12"
chezmoi = "2.72.0"
dprint = "0.64.3"
hadolint = "2.15.1"
jq = "1.8.2"
qlty = "0.665.0"
shellcheck = "0.11.0"
uv = "0.13.6"
yq = "4.54.1"

# qlty is not in the mise registry; its short name (which the parity test keys
# on) resolves to its GitHub releases.
[tool_alias]
qlty = "github:qltysh/qlty"

[tasks.test]
run = "uv run pytest"

# The same checks as CI's lint job, for a local run before pushing.
[tasks.lint]
run = [
  "dprint check",
  "actionlint",
  "hadolint --config .qlty/configs/.hadolint.yaml Dockerfile",
  "shellcheck install.sh",
  "uv run zizmor .github",
]
